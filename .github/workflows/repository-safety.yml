name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source and private-data boundaries
        run: python3 tools/check_repository.py
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Check prototype JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('prototypes/mobile-m1/index.html').read_text(encoding='utf-8')
          for script in re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.S | re.I):
              with tempfile.NamedTemporaryFile(mode='w', suffix='.js') as temporary:
                  temporary.write(script)
                  temporary.flush()
                  subprocess.run(['node', '--check', temporary.name], check=True)
          PY
